name: build

permissions:
  contents: read

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check Tabs
      run: |
        if git grep -n $'\t'          samples/*.cpp samples/*.h tutorials/*.cpp tutorials/*.h; then echo 'Please replace tabs with spaces in source files.';     false; fi

    - name: Check Whitespace
      run: |
        if git grep -n '[[:blank:]]$' samples/*.cpp samples/*.h tutorials/*.cpp tutorials/*.h; then echo 'Please remove trailing whitespace from source files.'; false; fi

  build:
    needs: check

    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        ext: [YES, NO]
        include:
        - os: windows-latest
          windows-arch: x64
        - os: windows-latest
          windows-arch: Win32
        - os: windows-11-arm
          windows-arch: ARM64
        - os: windows-11-arm
          windows-arch: ARM64EC

    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Get Ubuntu OpenGL Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libglfw3-dev

    - name: Get OpenCL Headers
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: KhronosGroup/OpenCL-Headers
        path: external/OpenCL-Headers

    - name: Get OpenCL ICD Loader
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: KhronosGroup/OpenCL-ICD-Loader
        path: external/opencl-icd-loader

    - name: Get OpenCL Extension Loader
      if: matrix.ext == 'YES'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: bashbaug/opencl-extension-loader
        path: external/opencl-extension-loader

    - name: Get SPIR-V Headers
      if: matrix.ext == 'YES'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: KhronosGroup/SPIRV-Headers
        path: external/SPIRV-Headers

    - name: Create Build Directory
      run: cmake -E make_directory ./build

    - name: Run CMake
      shell: bash
      working-directory: ./build
      run: |
        if [[ -n "${{ matrix.windows-arch }}" ]]; then
          cmake -DOpenCL_INCLUDE_DIRS=$GITHUB_WORKSPACE/external/OpenCL-Headers -DCMAKE_BUILD_TYPE=$BUILD_TYPE -A ${{ matrix.windows-arch }} $GITHUB_WORKSPACE
        else
          cmake -DOpenCL_INCLUDE_DIRS=$GITHUB_WORKSPACE/external/OpenCL-Headers -DCMAKE_BUILD_TYPE=$BUILD_TYPE                               $GITHUB_WORKSPACE
        fi

    - name: Build
      working-directory: ./build
      shell: bash
      run: cmake --build . --parallel --config $BUILD_TYPE

    #- name: Test
    #  working-directory: ./build
    #  shell: bash
    #  run: ctest -C $BUILD_TYPE
